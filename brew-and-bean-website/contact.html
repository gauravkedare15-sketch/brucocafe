<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruco Cafe | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><img src="images/bruco-logo.jpeg" alt="Bruco Coffee House logo"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main class="container narrow">
    <h1>Contact Us</h1>
    <p>Questions, feedback or a table booking? Send us a message.</p>

    <form action="#" method="post" class="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required minlength="2" placeholder="Your name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit number">

      <label for="topic">Topic</label>
      <select id="topic" name="topic">
        <option>Table booking</option>
        <option>Feedback</option>
        <option>Other</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required placeholder="Write your message"></textarea>

      <button type="submit" class="btn">Send Message</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Bruco Cafe. A practice project built with HTML and CSS.</p>
  </footer>
</body>
</html>
